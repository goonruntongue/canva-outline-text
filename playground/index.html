<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多重アウトライン文字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+JP:wght@900&family=RocknRoll+One&family=Zen+Maru+Gothic:wght@900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e2e0db; --accent: #ff5a36; --checker: #e9e7e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161617; --panel: #222224; --text: #f2f2f2; --muted: #a0a0a6;
      --line: #36363a; --accent: #ff7a5c; --checker: #2c2c2f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 14px;
  }
  header { padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  main {
    display: grid; grid-template-columns: 340px 1fr; gap: 16px;
    padding: 16px; max-width: 1280px; margin: 0 auto;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px;
  }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 700; }
  .panel + .panel { margin-top: 12px; }
  label.row { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 8px; margin: 8px 0; }
  label.row span.val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  textarea, select, input[type=text] {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px;
  }
  textarea { min-height: 70px; resize: vertical; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 36px; height: 30px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 7px 4px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .layer {
    display: grid; grid-template-columns: 20px 36px 1fr 36px 28px; gap: 8px; align-items: center;
    padding: 6px 0; border-top: 1px dashed var(--line);
  }
  .layer:first-child { border-top: 0; }
  .layer .idx { color: var(--muted); font-size: 12px; text-align: center; }
  .layer .w { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .iconbtn { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; height: 28px; cursor: pointer; }
  .btn {
    width: 100%; border: 0; border-radius: 8px; padding: 10px; font: inherit; font-weight: 700;
    cursor: pointer; background: var(--accent); color: #fff; margin-top: 8px;
  }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  .stage {
    background-color: var(--panel);
    background-image:
      linear-gradient(45deg, var(--checker) 25%, transparent 25%),
      linear-gradient(-45deg, var(--checker) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--checker) 75%),
      linear-gradient(-45deg, transparent 75%, var(--checker) 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    border: 1px solid var(--line); border-radius: 12px;
    min-height: 360px; display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow: auto; position: sticky; top: 16px;
  }
  .stage canvas { max-width: 100%; height: auto; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; text-align: right; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { flex: 1 1 auto; }
  /* グラデーションバーと、その下のカラーストップのつまみ */
  .gbar-wrap { position: relative; padding: 0 9px 24px; margin-top: 10px; touch-action: none; user-select: none; isolation: isolate; }
  .gbar { position: relative; height: 28px; border-radius: 8px; border: 1px solid var(--line); cursor: copy; }
  .gbar.full { cursor: default; }
  .stop {
    position: absolute; top: calc(100% + 4px); width: 18px; height: 18px; transform: translateX(-50%);
    border-radius: 4px; border: 1px solid var(--line); box-shadow: inset 0 0 0 2px var(--panel);
    cursor: grab; z-index: 1; color: var(--text);
  }
  .stop.sel { border: 2px solid currentColor; z-index: 2; }
  .stop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
  .stoprow { display: grid; grid-template-columns: 36px 1fr auto; gap: 8px; align-items: center; margin-top: 10px; }
  .btnrow { display: flex; gap: 6px; }
  .btnrow .btn { margin-top: 8px; }
  .btnrow .btn:last-child { flex: 0 0 auto; width: auto; padding: 10px 14px; }
  .btn:disabled, .iconbtn:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>多重アウトライン文字</h1>
  <p>Canvaアプリ化の前段プロトタイプ。透過PNGで書き出せます。</p>
</header>
<main>
  <div>
    <section class="panel">
      <h2>テキスト</h2>
      <textarea id="text">ふちどり
文字</textarea>
      <label class="row" style="grid-template-columns:88px 1fr;">フォント
        <select id="font">
          <option value='"Dela Gothic One"'>Dela Gothic One</option>
          <option value='"M PLUS Rounded 1c"|800'>M PLUS Rounded 1c</option>
          <option value='"Zen Maru Gothic"|900'>Zen Maru Gothic</option>
          <option value='"Noto Sans JP"|900'>Noto Sans JP</option>
          <option value='"RocknRoll One"'>RocknRoll One</option>
        </select>
      </label>
      <label class="row">サイズ <input type="range" id="size" min="24" max="300" value="140"><span class="val" id="sizeV"></span></label>
      <label class="row">字間 <input type="range" id="tracking" min="-40" max="80" value="0"><span class="val" id="trackingV"></span></label>
      <label class="row">行間 <input type="range" id="leading" min="80" max="200" value="115"><span class="val" id="leadingV"></span></label>
      <label class="row" style="grid-template-columns:88px 1fr;">揃え
        <div class="seg" id="align">
          <button data-v="left">左</button><button data-v="center" class="on">中央</button><button data-v="right">右</button>
        </div>
      </label>
    </section>

    <section class="panel">
      <h2>塗り</h2>
      <div class="seg" id="fillMode">
        <button data-v="solid" class="on">単色</button><button data-v="gradient">グラデーション</button>
      </div>
      <div id="solidBox">
        <label class="row" style="grid-template-columns:88px auto 1fr;">塗りの色 <input type="color" id="fill" value="#ffffff"><span></span></label>
      </div>
      <div id="gradBox" hidden>
        <div class="seg" id="gradType" style="margin-top:10px;">
          <button data-v="linear" class="on">線形</button><button data-v="radial">円形</button>
        </div>
        <div class="gbar-wrap">
          <div class="gbar" id="gbar" role="presentation"></div>
        </div>
        <p class="hint">バーをクリックするとカラーストップを追加できます。ストップはドラッグで動かせます。</p>
        <div class="stoprow">
          <input type="color" id="stopColor" aria-label="選択中のストップの色">
          <span id="stopLabel"></span>
          <button class="iconbtn" id="stopRemove" style="padding:0 10px;">削除</button>
        </div>
        <label class="row" style="grid-template-columns:88px 1fr 44px;">位置 <input type="range" id="stopOffset" min="0" max="100" step="1"><span class="val" id="stopOffsetV"></span></label>
        <div class="btnrow">
          <button class="btn ghost" id="stopAdd">＋ カラーストップを追加</button>
          <button class="btn ghost" id="gradReverse">反転</button>
        </div>
        <label class="row" id="angleRow">角度 <input type="range" id="angle" min="0" max="359" step="1" value="90"><span class="val" id="angleV"></span></label>
      </div>
    </section>

    <section class="panel">
      <h2>角の結合</h2>
      <div class="seg" id="join">
        <button data-v="round" class="on">ラウンド</button><button data-v="miter">マイター</button><button data-v="bevel">ベベル</button>
      </div>
    </section>

    <section class="panel">
      <h2>アウトライン（上が内側）</h2>
      <div id="layers"></div>
      <button class="btn ghost" id="addLayer">＋ 外側に追加</button>
      <div class="presets" style="margin-top:8px;">
        <button class="btn ghost" data-preset="pop">ポップ</button>
        <button class="btn ghost" data-preset="candy">キャンディ</button>
        <button class="btn ghost" data-preset="mono">モノ</button>
      </div>
    </section>

    <section class="panel">
      <h2>書き出し</h2>
      <label class="row">倍率 <input type="range" id="scale" min="1" max="4" step="1" value="2"><span class="val" id="scaleV"></span></label>
      <button class="btn" id="download">PNGをダウンロード</button>
    </section>
  </div>

  <div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="meta" id="meta"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

const PRESETS = {
  pop:   [{ w: 10, c: "#ff3d7f" }, { w: 8, c: "#ffffff" }, { w: 10, c: "#2b2b8f" }],
  candy: [{ w: 8, c: "#ff8fb1" }, { w: 6, c: "#fff3a6" }, { w: 6, c: "#8fd6ff" }, { w: 8, c: "#5b3b8c" }],
  mono:  [{ w: 12, c: "#111111" }, { w: 6, c: "#ffffff" }, { w: 4, c: "#111111" }],
};

const MAX_STOPS = 8;
const MIN_STOPS = 2;

const state = {
  layers: PRESETS.pop.map((l) => ({ ...l })),
  join: "round",
  align: "center",
  fillMode: "solid",
  // 0° は左→右、90° は上→下（CSS の linear-gradient と同じ向き）
  grad: {
    type: "linear",
    angle: 90,
    stops: [{ offset: 0, color: "#fff27a" }, { offset: 100, color: "#ff7ab6" }],
  },
  sel: 0,
};

const clamp = (v, min, max) => Math.min(Math.max(v, min), max);
const sortStops = (stops) => [...stops].sort((a, b) => a.offset - b.offset);
const hexToRgb = (hex) => {
  const n = parseInt(hex.slice(1), 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgbToHex = (r, g, b) =>
  "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");

// グラデーションの、ある位置（0〜100）の色を求める（ストップの追加用）
function colorAt(stops, offset) {
  const s = sortStops(stops);
  if (offset <= s[0].offset) return s[0].color;
  if (offset >= s[s.length - 1].offset) return s[s.length - 1].color;
  for (let i = 0; i < s.length - 1; i++) {
    const a = s[i], b = s[i + 1];
    if (offset >= a.offset && offset <= b.offset) {
      const t = b.offset === a.offset ? 0 : (offset - a.offset) / (b.offset - a.offset);
      const ca = hexToRgb(a.color), cb = hexToRgb(b.color);
      return rgbToHex(...ca.map((v, k) => v + (cb[k] - v) * t));
    }
  }
  return s[s.length - 1].color;
}

// 文字が占める範囲に合わせてグラデーションを作る
function makeGradient(ctx, g, b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  let grad;
  if (g.type === "radial") {
    // CSS の farthest-corner と同じく、中心から角までを半径にする
    grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.hypot(b.w / 2, b.h / 2));
  } else {
    // CSS の linear-gradient と同じく、角度に応じて範囲全体を覆う長さにする
    const rad = (g.angle * Math.PI) / 180;
    const dx = Math.cos(rad), dy = Math.sin(rad);
    const half = (Math.abs(b.w * dx) + Math.abs(b.h * dy)) / 2;
    grad = ctx.createLinearGradient(cx - dx * half, cy - dy * half, cx + dx * half, cy + dy * half);
  }
  for (const st of sortStops(g.stops)) grad.addColorStop(clamp(st.offset, 0, 100) / 100, st.color);
  return grad;
}

function renderLayerControls() {
  const box = $("layers");
  box.innerHTML = "";
  state.layers.forEach((l, i) => {
    const row = document.createElement("div");
    row.className = "layer";
    row.innerHTML = `
      <span class="idx">${i + 1}</span>
      <input type="color" value="${l.c}">
      <input type="range" min="1" max="60" value="${l.w}">
      <span class="w">${l.w}</span>
      <button class="iconbtn" title="削除">×</button>`;
    const [color, range] = row.querySelectorAll("input");
    const wLabel = row.querySelector(".w");
    color.addEventListener("input", () => { l.c = color.value; draw(); });
    range.addEventListener("input", () => { l.w = +range.value; wLabel.textContent = l.w; draw(); });
    row.querySelector("button").addEventListener("click", () => {
      state.layers.splice(i, 1); renderLayerControls(); draw();
    });
    box.appendChild(row);
  });
}

function fontSpec() {
  const [family, weight = "400"] = $("font").value.split("|");
  return { family, weight };
}

// テキストをキャンバスへ描画。scale は書き出し倍率。
function render(canvas, scale) {
  const ctx = canvas.getContext("2d");
  const lines = $("text").value.split("\n");
  const size = +$("size").value;
  const tracking = +$("tracking").value / 100; // em
  const leading = +$("leading").value / 100;
  const { family, weight } = fontSpec();
  const totalOutline = state.layers.reduce((s, l) => s + l.w, 0);
  const pad = totalOutline + Math.ceil(size * 0.1);

  const font = `${weight} ${size}px ${family}`;
  ctx.font = font;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${tracking * size}px`;

  const metrics = lines.map((t) => ctx.measureText(t || " "));
  const ascent = Math.max(...metrics.map((m) => m.actualBoundingBoxAscent || size * 0.88), size * 0.5);
  const descent = Math.max(...metrics.map((m) => m.actualBoundingBoxDescent || size * 0.12), size * 0.1);
  const lineH = size * leading;
  const maxW = Math.max(...metrics.map((m) => m.width), 1);

  const contentH = ascent + descent + lineH * (lines.length - 1);
  const W = Math.ceil(maxW + pad * 2);
  const H = Math.ceil(contentH + pad * 2);

  canvas.width = W * scale;
  canvas.height = H * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.font = font;
  if ("letterSpacing" in ctx) ctx.letterSpacing = `${tracking * size}px`;
  ctx.textBaseline = "alphabetic";
  ctx.lineJoin = state.join;
  ctx.lineCap = state.join === "round" ? "round" : "butt";
  ctx.miterLimit = 10;

  const xFor = (w) =>
    state.align === "left" ? pad : state.align === "right" ? W - pad - w : (W - w) / 2;

  const eachLine = (fn) =>
    lines.forEach((t, i) => fn(t, xFor(metrics[i].width), pad + ascent + lineH * i));

  // 外側から内側へ。各レイヤーの線幅は「そのレイヤーまでの累計太さ×2」。
  for (let i = state.layers.length - 1; i >= 0; i--) {
    const cumulative = state.layers.slice(0, i + 1).reduce((s, l) => s + l.w, 0);
    ctx.lineWidth = cumulative * 2;
    ctx.strokeStyle = state.layers[i].c;
    eachLine((t, x, y) => ctx.strokeText(t, x, y));
  }
  if (state.fillMode === "gradient") {
    let left = Infinity, right = -Infinity;
    metrics.forEach((m) => { const x = xFor(m.width); left = Math.min(left, x); right = Math.max(right, x + m.width); });
    if (!(right > left)) { left = pad; right = pad + 1; }
    ctx.fillStyle = makeGradient(ctx, state.grad, { x: left, y: pad, w: right - left, h: Math.max(contentH, 1) });
  } else {
    ctx.fillStyle = $("fill").value;
  }
  eachLine((t, x, y) => ctx.fillText(t, x, y));

  return { W, H };
}

let pending = false;
function draw() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(async () => {
    pending = false;
    const { family, weight } = fontSpec();
    try { await document.fonts.load(`${weight} 40px ${family}`, $("text").value); } catch (e) {}
    const cv = $("cv");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const { W, H } = render(cv, dpr);
    cv.style.width = W + "px";
    $("meta").textContent = `${W} × ${H}px（等倍）・アウトライン ${state.layers.length} 層`;
    ["size", "tracking", "leading", "scale"].forEach((k) => {
      const v = $(k).value;
      $(k + "V").textContent = k === "scale" ? `×${v}` : k === "size" ? v : (k === "leading" ? v + "%" : v);
    });
  });
}

// ---- グラデーションの編集 ----
let dragging = null;

function gradientCss(stops) {
  return `linear-gradient(90deg, ${sortStops(stops).map((s) => `${s.color} ${s.offset}%`).join(", ")})`;
}

function renderGradEditor() {
  const g = state.grad;
  state.sel = clamp(state.sel, 0, g.stops.length - 1);
  const bar = $("gbar");
  bar.style.background = gradientCss(g.stops);
  bar.classList.toggle("full", g.stops.length >= MAX_STOPS);
  // つまみは作り直さず、数の差だけ足し引きする（ドラッグ中にフォーカスが外れないように）
  while (bar.children.length < g.stops.length) {
    const h = document.createElement("div");
    h.className = "stop";
    h.tabIndex = 0;
    h.setAttribute("role", "slider");
    h.setAttribute("aria-valuemin", "0");
    h.setAttribute("aria-valuemax", "100");
    bar.appendChild(h);
  }
  while (bar.children.length > g.stops.length) bar.lastChild.remove();
  g.stops.forEach((s, i) => {
    const h = bar.children[i];
    h.dataset.i = i;
    h.style.left = `${s.offset}%`;
    h.style.background = s.color;
    h.classList.toggle("sel", i === state.sel);
    h.setAttribute("aria-valuenow", s.offset);
    h.setAttribute("aria-label", `カラーストップ ${i + 1}、${s.offset}%`);
  });
  const st = g.stops[state.sel];
  $("stopColor").value = st.color;
  $("stopLabel").textContent = `カラーストップ ${state.sel + 1} · ${st.offset}%`;
  $("stopOffset").value = st.offset;
  $("stopOffsetV").textContent = `${st.offset}%`;
  $("stopRemove").disabled = g.stops.length <= MIN_STOPS;
  $("stopAdd").disabled = g.stops.length >= MAX_STOPS;
  $("angle").value = g.angle;
  $("angleV").textContent = `${g.angle}°`;
  $("angleRow").hidden = g.type !== "linear";
}

function changed() { renderGradEditor(); draw(); }

function offsetFromPointer(clientX) {
  const r = $("gbar").getBoundingClientRect();
  return r.width ? Math.round(clamp(((clientX - r.left) / r.width) * 100, 0, 100)) : 0;
}

function addStopAt(offset) {
  const g = state.grad;
  if (g.stops.length >= MAX_STOPS) return -1;
  g.stops.push({ offset, color: colorAt(g.stops, offset) });
  state.sel = g.stops.length - 1;
  return state.sel;
}

function removeStop(i) {
  const g = state.grad;
  if (g.stops.length <= MIN_STOPS) return;
  g.stops.splice(i, 1);
  state.sel = clamp(i - 1, 0, g.stops.length - 1);
  changed();
}

$("gbar").addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".stop");
  let i;
  if (handle) {
    e.preventDefault();
    handle.focus();
    i = +handle.dataset.i;
    state.sel = i;
  } else {
    // バーの何もない所を押したら、その位置にストップを追加してそのままドラッグできるようにする
    i = addStopAt(offsetFromPointer(e.clientX));
    if (i < 0) return;
  }
  dragging = i;
  $("gbar").setPointerCapture(e.pointerId);
  changed();
});
$("gbar").addEventListener("pointermove", (e) => {
  if (dragging === null) return;
  state.grad.stops[dragging].offset = offsetFromPointer(e.clientX);
  changed();
});
const endDrag = (e) => {
  if (dragging === null) return;
  dragging = null;
  if ($("gbar").hasPointerCapture(e.pointerId)) $("gbar").releasePointerCapture(e.pointerId);
};
$("gbar").addEventListener("pointerup", endDrag);
$("gbar").addEventListener("pointercancel", endDrag);
$("gbar").addEventListener("focusin", (e) => {
  const h = e.target.closest(".stop");
  if (h && +h.dataset.i !== state.sel) { state.sel = +h.dataset.i; renderGradEditor(); }
});
// 矢印キーで ±1、Shift で ±10、Delete で削除
$("gbar").addEventListener("keydown", (e) => {
  const h = e.target.closest(".stop");
  if (!h) return;
  const i = +h.dataset.i;
  const st = state.grad.stops[i];
  const step = e.shiftKey ? 10 : 1;
  if (e.key === "ArrowLeft" || e.key === "ArrowDown") st.offset = clamp(st.offset - step, 0, 100);
  else if (e.key === "ArrowRight" || e.key === "ArrowUp") st.offset = clamp(st.offset + step, 0, 100);
  else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); removeStop(i); return; }
  else return;
  e.preventDefault();
  changed();
});

$("stopColor").addEventListener("input", () => { state.grad.stops[state.sel].color = $("stopColor").value; changed(); });
$("stopOffset").addEventListener("input", () => { state.grad.stops[state.sel].offset = +$("stopOffset").value; changed(); });
$("stopRemove").addEventListener("click", () => removeStop(state.sel));
// いちばん広いすき間の真ん中に追加する
$("stopAdd").addEventListener("click", () => {
  const s = sortStops(state.grad.stops);
  let best = { at: 50, gap: -1 };
  for (let i = 0; i < s.length - 1; i++) {
    const gap = s[i + 1].offset - s[i].offset;
    if (gap > best.gap) best = { at: Math.round((s[i].offset + s[i + 1].offset) / 2), gap };
  }
  addStopAt(best.at);
  changed();
});
$("gradReverse").addEventListener("click", () => {
  state.grad.stops.forEach((s) => { s.offset = 100 - s.offset; });
  changed();
});
$("angle").addEventListener("input", () => { state.grad.angle = +$("angle").value; changed(); });

// イベント
["text", "font", "size", "tracking", "leading", "fill", "scale"].forEach((id) =>
  $(id).addEventListener("input", draw)
);
function seg(id, key) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    state[key] = b.dataset.v;
    draw();
  });
}
seg("join", "join");
seg("align", "align");
seg("fillMode", "fillMode");
$("fillMode").addEventListener("click", () => {
  $("solidBox").hidden = state.fillMode !== "solid";
  $("gradBox").hidden = state.fillMode !== "gradient";
});
$("gradType").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  $("gradType").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  state.grad.type = b.dataset.v;
  changed();
});

$("addLayer").addEventListener("click", () => {
  const last = state.layers[state.layers.length - 1];
  state.layers.push({ w: last ? last.w : 8, c: "#000000" });
  renderLayerControls(); draw();
});
document.querySelectorAll("[data-preset]").forEach((b) =>
  b.addEventListener("click", () => {
    state.layers = PRESETS[b.dataset.preset].map((l) => ({ ...l }));
    renderLayerControls(); draw();
  })
);
$("download").addEventListener("click", async () => {
  const { family, weight } = fontSpec();
  try { await document.fonts.load(`${weight} 40px ${family}`, $("text").value); } catch (e) {}
  const off = document.createElement("canvas");
  render(off, +$("scale").value);
  off.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `outline-text-${Date.now()}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, "image/png");
});

renderLayerControls();
renderGradEditor();
document.fonts.ready.then(draw);
draw();
</script>
</body>
</html>
